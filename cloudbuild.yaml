# Builds and pushes the exome-results-browsers image. Submitted by the Build image workflow once CI
# passes on main, see deployment/README.md. The build runs in the exome-results-browsers project and
# pushes to the shared gnomad registry in exac-gnomad. To run it by hand:
#
#   gcloud builds submit --config cloudbuild.yaml --project=exome-results-browsers \
#     --substitutions=BRANCH_NAME="my-branch",SHORT_SHA="$(git rev-parse --short HEAD)" .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -euo pipefail

        image="us-docker.pkg.dev/exac-gnomad/gnomad/exome-results-browsers"
        # Slashes are legal in a branch name but not in an image tag.
        branch=$$(echo "$BRANCH_NAME" | tr '/' '-')
        dated_tag="$${branch:-manual}-$$(date -u +%Y-%m-%d)-$SHORT_SHA"

        docker build --tag "$${image}:$SHORT_SHA" --tag "$${image}:$${dated_tag}" .
        docker push "$${image}:$SHORT_SHA"
        docker push "$${image}:$${dated_tag}"

timeout: 1800s

# This project has never run a build, so it has no default build service account to inherit.
serviceAccount: 'projects/exome-results-browsers/serviceAccounts/erb-cloud-build@exome-results-browsers.iam.gserviceaccount.com'

options:
  machineType: 'E2_HIGHCPU_8'
  # A build that names its own service account has to say where its logs go.
  logging: GCS_ONLY
