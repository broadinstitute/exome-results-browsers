[project]
name = "exome-results-browsers"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "hail==0.2.138",
  "tqdm",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["data_pipeline"]
