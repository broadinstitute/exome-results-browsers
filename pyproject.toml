[project]
name = "exome-results-browsers"
version = "0.1.0"
requires-python = "==3.12.9"
dependencies = [
  "hail==0.2.126",
  # hail/__init__.py imports pkg_resources, but hail does not declare setuptools as a
  # dependency, and `uv venv` does not seed it, so it has to be explicit. setuptools 82
  # removed pkg_resources.
  "setuptools<82",
  "tqdm",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["data_pipeline"]
